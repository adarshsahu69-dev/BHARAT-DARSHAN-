# Continuous integration for the Bharat Darshan Next.js app.
#
# This is no longer a GitHub Pages deployment. The app runs on a Node server
# (Prisma, NextAuth and route handlers require one), so it must be hosted on a
# platform that runs a Node process — Vercel, Render, Railway, Fly.io. See the
# README section "Admin panel (Prisma + NextAuth)".
#
# This pipeline only verifies that the app installs, lints, type-checks and
# builds; deployment is the host's job.
#
# To get started with Next.js see: https://nextjs.org/docs/getting-started
#
name: CI

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Runs on every pull request, however it is opened
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent run per branch, cancelling any run in progress so
# the branch always runs the latest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional. The build itself needs no environment variables: the app
      # builds in demo mode when nothing is configured. These are only passed
      # so the lint/type-check/build steps see a realistic configuration.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Next.js 15 warns that Node 20 is on its way out; 22 is the oldest
          # supported version that builds without a deprecation warning.
          node-version: "22"
          cache: npm
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - name: Install dependencies
        # `npm ci` reproduces the lockfile exactly. The `postinstall` script it
        # runs also generates the Prisma client, which `next build` imports —
        # so this step is what makes the build succeed on a clean checkout.
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Build with Next.js
        run: npm run build
